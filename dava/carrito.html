<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>DAVA | Carrito</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top" id="mainNavbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="img\logos\nombre.png" alt="DAVA" height="40"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-label="Menú hamburguesa"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="catalogo.html">Catálogo</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="dava.html">¿Quién es DAVA?</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cuidados.html">Cuidados</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contacto.html">Contacto</a>
            </li>
            <li class="nav-item ms-auto">
              <a class="nav-link" href="carrito.html">
                <img src="img/carrito.png" alt="carrito" height="20"
              /></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="container my-5">
      <h2 class="text-center">Mi carrito</h2>
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div
            id="resultado"
            style="background: #f5f5f5; padding: 20px; border-radius: 10px"
          ></div>
          <br />
          <button id="mostrar" class="btn btn-primary">Mostrar carrito</button>
          <button id="limpiar" class="btn btn-secondary">Vaciar carrito</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container text-center">
        <a href="cuidados.html">Guía de cuidados</a> |
        <a href="contacto.html">Contacto</a> |
        <a href="politicas.html">Políticas</a>
        <p>© 2026 DAVA | Creado para ti</p>
      </div>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Mostrar carrito
      $("#mostrar").click(function () {
        let carrito = JSON.parse(sessionStorage.getItem("carrito")) || [];

        if (carrito.length === 0) {
          $("#resultado").html("Carrito vacío");
        } else {
          let texto = "<h3>Contenido del carrito:</h3>";
          for (let i = 0; i < carrito.length; i++) {
            texto +=
              "<p>• " +
              carrito[i].nombre +
              " | Cantidad: " +
              carrito[i].cantidad +
              " | Precio: " +
              carrito[i].precio +
              "€</p>";
          }
          $("#resultado").html(texto);
        }
      });

      $("#limpiar").click(function () {
        sessionStorage.removeItem("carrito");
        $("#resultado").html("Carrito vaciado");
        actualizarContadorNavbar();
      });

      function actualizarContadorNavbar() {
        let carrito = JSON.parse(sessionStorage.getItem("carrito")) || [];
        let total = 0;
        for (let i = 0; i < carrito.length; i++) {
          total += carrito[i].cantidad;
        }
        $(".cart-count").remove();
        if (total > 0) {
          $(".nav-link:contains('Carrito')").append(
            ' <span class="cart-count" style="background-color:#FF6B8A; color:white; border-radius:50%; padding:2px 8px; font-size:12px;">' +
              total +
              "</span>",
          );
        }
      }

      actualizarContadorNavbar();
    </script>
  </body>
</html>
