      rel="stylesheet"
    />

      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="img\logos\nombre.png" alt="DAVA" height="40"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-label="Menú hamburguesa"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="catalogo.html">Catálogo</a>
            </li>

              <a class="nav-link" href="dava.html">¿Quién es DAVA?</a>

            <li class="nav-item ms-auto">

              /></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="container my-5">
      <h2 class="text-center">Contacta con nosotros</h2>
      <p class="text-center mb-5">
        ¿Preguntas, sugerencias o necesitas ayuda? Escríbenos
      </p>

      <div class="row justify-content-center">
        <div class="col-md-6">
          <div id="mensaje-formulario"></div>

          <form id="form-contacto">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre completo *</label>
              <input
                type="text"
                class="form-control"
                id="nombre"
                placeholder="Tu nombre"
              />
              <div class="error-nombre text-danger small mt-1"></div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico *</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="tu@email.com"
              />
              <div class="error-email text-danger small mt-1"></div>
            </div>

            <div class="mb-3">
              <label for="telefono" class="form-label"
                >Teléfono (opcional)</label
              >
              <input
                type="tel"
                class="form-control"
                id="telefono"
                placeholder="Opcional"
              />
            </div>

            <div class="mb-3">
              <label for="asunto" class="form-label">Asunto *</label>
              <input
                type="text"
                class="form-control"
                id="asunto"
                placeholder="¿Sobre qué quieres hablar?"
              />
              <div class="error-asunto text-danger small mt-1"></div>
            </div>

            <div class="mb-3">
              <label for="mensaje" class="form-label">Mensaje *</label>
              <textarea
                class="form-control"
                id="mensaje"
                rows="5"
                placeholder="Cuéntanos..."
              ></textarea>
              <div class="error-mensaje text-danger small mt-1"></div>
            </div>

            <button type="submit" class="btn-primario w-100">
              Enviar mensaje
            </button>
          </form>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container text-center">
        <a href="cuidados.html">Guía de cuidados</a> |
        <a href="contacto.html">Contacto</a> |
        <a href="politicas.html">Políticas</a>
        <p>© 2026 DAVA | Creado para ti</p>
      </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <script>
      $(document).ready(function () {
        $("#form-contacto").submit(function (evento) {
          evento.preventDefault(); // Evita que recargue la página

          // Limpiar errores anteriores
          $(".error-nombre, .error-email, .error-asunto, .error-mensaje").html(
            "",
          );
          $("#mensaje-formulario").html("");

          // Obtener valores
          let nombre = $("#nombre").val().trim();
          let email = $("#email").val().trim();
          let asunto = $("#asunto").val().trim();
          let mensaje = $("#mensaje").val().trim();

          let errores = false;

          // Validar nombre
          if (nombre === "") {
            $(".error-nombre").html("El nombre es obligatorio");
            errores = true;
          }

          // Validar email
          if (email === "") {
            $(".error-email").html("El correo electrónico es obligatorio");
            errores = true;
          } else if (!email.includes("@") || !email.includes(".")) {
            $(".error-email").html(
              "Introduce un correo electrónico válido (debe contener @ y .)",
            );
            errores = true;
          }

          // Validar asunto
          if (asunto === "") {
            $(".error-asunto").html("El asunto es obligatorio");
            errores = true;
          }

          // Validar mensaje
          if (mensaje === "") {
            $(".error-mensaje").html("El mensaje es obligatorio");
            errores = true;
          }

          // Si no hay errores
          if (!errores) {
            $("#mensaje-formulario").html(
              '<div class="alert alert-success">Mensaje enviado correctamente. Te responderemos pronto.</div>',
            );
            $("#form-contacto")[0].reset(); // Limpiar formulario
          } else {
            $("#mensaje-formulario").html(
              '<div class="alert alert-danger">Por favor, corrige los errores del formulario.</div>',
            );
          }
        });
      });
    </script>
  </body>
</html>
